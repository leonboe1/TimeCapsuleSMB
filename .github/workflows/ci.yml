name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  samba-regressions:
    name: Patched Samba regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Samba test build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 git bison flex libparse-yapp-perl libgnutls28-dev zlib1g-dev libpopt-dev
      - name: Build and run the no-pthread Samba tests with sanitizers
        run: python3 -m tests.samba.run host --work "$RUNNER_TEMP/samba-regressions" --jobs 2 --sanitizers

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Compile all native helpers
        run: ./build/native/host-check.sh

      - name: Native sanitizer tests
        env:
          TC_NATIVE_SANITIZERS: "1"
          UBSAN_OPTIONS: "halt_on_error=1"
        run: python -m pytest tests/native tests/test_deploy_modules.py

      - name: Run Ruff
        run: python -m ruff check src tests macos/TimeCapsuleSMB/tools tcapsule

      - name: Verify checked-in artifact manifest
        run: python -m pytest tests/test_artifacts.py tests/test_artifact_resolver.py

      - name: Run full test suite
        run: python -m pytest

  swift-test:
    name: Swift Tests (macOS)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run Swift tests
        run: swift test --package-path macos/TimeCapsuleSMB

  package-app:
    name: Package App (macOS native)
    runs-on: macos-latest
    needs:
      - swift-test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore authenticated download archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            macos/TimeCapsuleSMB/.build/package-app/python-runtime
            macos/TimeCapsuleSMB/.build/package-app/python-downloads
            macos/TimeCapsuleSMB/.build/package-app/native-downloads
          key: verified-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/TimeCapsuleSMB/tools/native-inputs.json', 'macos/TimeCapsuleSMB/tools/package_app.py') }}
          restore-keys: |
            verified-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Package and validate native app
        run: |
          python3 macos/TimeCapsuleSMB/tools/package_app.py \
            --configuration release \
            --arch native \
            --full-validation \
            --zip

      - name: Retain the exact app and verification records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TimeCapsuleSMB-arm64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            macos/TimeCapsuleSMB/dist/TimeCapsuleSMB.app.zip
            macos/TimeCapsuleSMB/dist/TimeCapsuleSMB-provenance.json
